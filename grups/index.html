<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Grups · Veloguess</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700;800&family=Barlow:wght@400;500;600&display=swap">
<link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
<div class="wrap">
  <header class="topbar">
    <a class="logo" href="../">Velo<span>guess</span></a>
    <div class="topbar-actions">
      <button class="icon-btn" id="open-stats" data-i18n="stats">Estadístiques</button>
      <select class="lang" aria-label="Idioma"></select>
    </div>
  </header>

  <div>
    <h1 data-i18n="grName">Grups</h1>
    <p class="lead" data-i18n="gr.intro"></p>
  </div>

  <div class="mode-bar">
    <div class="segmented" role="group">
      <button id="m-daily" aria-pressed="true" data-i18n="modeDaily">Diari</button>
      <button id="m-free" aria-pressed="false" data-i18n="modeFree">Lliure</button>
    </div>
    <span class="counter"><span id="mistakes"></span><span class="dots" id="dots" aria-hidden="true"></span></span>
  </div>

  <div class="gr-grid" id="grid"></div>
  <p class="flash" id="flash" aria-live="polite"></p>

  <div class="actions">
    <button class="btn" id="shuffle" data-i18n="gr.shuffle">Barreja</button>
    <button class="btn" id="clear" data-i18n="gr.clear">Desselecciona</button>
    <button class="btn primary" id="submit" data-i18n="gr.submit">Comprova</button>
  </div>
  <div class="actions">
    <button class="btn" id="hint" data-i18n="hintBtn">Pista (veure anunci)</button>
  </div>
  <div class="hint-box" id="hint-box" hidden></div>

  <section class="result" id="result" hidden></section>

  <footer data-i18n="sampleNote"></footer>
</div>

<dialog id="stats">
  <h2 data-i18n="stats"></h2>
  <div class="stats-row">
    <div><b id="st-played">0</b><span data-i18n="played"></span></div>
    <div><b id="st-pct">0</b><span data-i18n="gr.winPct"></span></div>
    <div><b id="st-streak">0</b><span data-i18n="streak"></span></div>
    <div><b id="st-max">0</b><span data-i18n="maxStreak"></span></div>
  </div>
  <div class="actions" style="justify-content:flex-end">
    <button class="btn" id="close-stats" data-i18n="close"></button>
  </div>
</dialog>

<dialog id="ad">
  <div class="ad-sim">
    <span class="counter" data-i18n="adSim"></span>
    <h2 data-i18n="adTitle"></h2>
    <p data-i18n="adText" style="margin:0;color:var(--muted)"></p>
    <div class="count" id="ad-count">3</div>
  </div>
</dialog>

<script type="module" src="../assets/js/grups.js"></script>
</body>
</html>
