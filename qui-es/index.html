<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Qui és? · Veloguess</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700;800&family=Barlow:wght@400;500;600&display=swap">
<link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
<div class="wrap">
  <header class="topbar">
    <a class="logo" href="../">Velo<span>guess</span></a>
    <div class="topbar-actions">
      <button class="icon-btn" id="open-stats" data-i18n="stats">Estadístiques</button>
      <select class="lang" aria-label="Idioma"></select>
    </div>
  </header>

  <div>
    <h1 data-i18n="whoName">Qui és?</h1>
    <p class="lead" data-i18n="whoDesc"></p>
  </div>

  <div class="mode-bar">
    <div class="segmented" role="group">
      <button id="m-daily" aria-pressed="true" data-i18n="modeDaily">Diari</button>
      <button id="m-free" aria-pressed="false" data-i18n="modeFree">Lliure</button>
    </div>
    <span class="counter" id="tries"></span>
  </div>

  <div class="search">
    <input id="q" type="text" autocomplete="off" spellcheck="false" role="combobox" aria-expanded="false" aria-controls="suggest" aria-label="Corredor">
    <ul id="suggest" class="suggest" role="listbox" hidden></ul>
  </div>

  <div class="actions">
    <button class="btn" id="hint"></button>
    <button class="btn" id="giveup" data-i18n="giveUp"></button>
  </div>
  <div class="hint-box" id="hint-box" hidden></div>

  <div class="board">
    <div class="grid" id="grid">
      <div class="head" data-i18n="colRider"></div>
      <div class="head" data-i18n="colNat"></div>
      <div class="head" data-i18n="colTeam"></div>
      <div class="head" data-i18n="colAge"></div>
      <div class="head" data-i18n="colSpec"></div>
      <div class="head" data-i18n="colGT"></div>
      <div class="head" data-i18n="colMon"></div>
    </div>
  </div>

  <div class="legend">
    <span><i style="background:var(--ok)"></i><span data-i18n="legendOk"></span></span>
    <span><i style="background:var(--near)"></i><span data-i18n="legendNear"></span></span>
    <span><i style="background:var(--miss);border:1px solid var(--line-strong)"></i><span data-i18n="legendMiss"></span></span>
    <span data-i18n="legendArrow"></span>
  </div>

  <section class="result" id="result" hidden></section>

  <footer id="note"></footer>
</div>

<dialog id="stats">
  <h2 data-i18n="stats"></h2>
  <div class="stats-row">
    <div><b id="st-played">0</b><span data-i18n="played"></span></div>
    <div><b id="st-pct">0</b><span data-i18n="winPct"></span></div>
    <div><b id="st-streak">0</b><span data-i18n="streak"></span></div>
    <div><b id="st-max">0</b><span data-i18n="maxStreak"></span></div>
  </div>
  <h3 data-i18n="distribution" style="font-size:1rem;margin-bottom:8px"></h3>
  <div class="dist" id="st-dist"></div>
  <div class="actions" style="margin-top:16px;justify-content:flex-end">
    <button class="btn" id="close-stats" data-i18n="close"></button>
  </div>
</dialog>

<dialog id="confirm-giveup">
  <p data-i18n="giveUpConfirm" style="margin:0 0 16px"></p>
  <div class="actions" style="justify-content:flex-end">
    <button class="btn" id="giveup-no" data-i18n="cancel"></button>
    <button class="btn primary" id="giveup-yes" data-i18n="giveUpYes"></button>
  </div>
</dialog>

<dialog id="ad">
  <div class="ad-sim">
    <span class="counter" data-i18n="adSim"></span>
    <h2 data-i18n="adTitle"></h2>
    <p data-i18n="adText" style="margin:0;color:var(--muted)"></p>
    <div class="count" id="ad-count">3</div>
  </div>
</dialog>

<script type="module" src="../assets/js/qui-es.js"></script>
</body>
</html>
