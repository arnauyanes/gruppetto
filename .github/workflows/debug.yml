name: Diagnostic fonts

on:
  push:
    branches: [main]
    paths: ["scripts/debug_sources.py"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - run: python scripts/debug_sources.py
      - if: always()
        run: |
          git config user.name "gruppetto-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -m "Diagnòstic de fonts"
          git pull --rebase origin main
          git push origin HEAD:main
