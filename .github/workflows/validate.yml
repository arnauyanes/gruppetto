name: Valida les dades

on:
  pull_request:
  push:
    branches: [main, "data/**"]
    paths: ["data/**", "scripts/**", "assets/js/**"]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/validate_data.py
      - name: Comprova la sintaxi del JavaScript
        run: for f in assets/js/*.js; do node --check "$f"; done
