<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gruppetto</title>
<meta name="description" content="Jocs diaris per a aficionats al ciclisme.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700;800&family=Barlow:wght@400;500;600&display=swap">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div class="wrap">
  <header class="topbar">
    <a class="logo" href="./">Gruppe<span>tto</span></a>
    <div class="topbar-actions">
      <select class="lang" aria-label="Idioma"></select>
    </div>
  </header>

  <div>
    <h1>Gruppe<span style="color:var(--accent)">tto</span></h1>
    <p class="lead" data-i18n="tagline"></p>
  </div>

  <h2 data-i18n="gamesTitle"></h2>
  <div class="games">
    <a class="game-card" href="qui-es/">
      <span class="tag" data-i18n="modeDaily"></span>
      <h3 data-i18n="whoName" style="font-size:1.6rem"></h3>
      <p data-i18n="whoDesc"></p>
    </a>
    <div class="game-card soon">
      <span class="tag" data-i18n="soon"></span>
      <h3 data-i18n="historyName" style="font-size:1.6rem"></h3>
      <p data-i18n="historyDesc"></p>
    </div>
    <div class="game-card soon">
      <span class="tag" data-i18n="soon"></span>
      <h3 data-i18n="gridName" style="font-size:1.6rem"></h3>
      <p data-i18n="gridDesc"></p>
    </div>
  </div>

  <footer data-i18n="sampleNote"></footer>
</div>
<script type="module">
  import { applyI18n } from "./assets/js/i18n.js";
  applyI18n();
</script>
</body>
</html>
