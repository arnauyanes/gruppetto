name: Revisió de plantilles

# Compara les plantilles de la temporada indicada amb data/riders.json i deixa
# els resultats a work/ en una branca de revisió. Mai modifica main.
on:
  push:
    branches: ["data/**"]
    paths: ["scripts/roster_2027.py", ".github/workflows/roster-review.yml"]
  workflow_dispatch:
    inputs:
      season:
        description: "Temporada a comparar"
        default: "2027"

permissions:
  contents: write

concurrency:
  group: roster-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - run: python scripts/roster_2027.py --season "${{ github.event.inputs.season || '2027' }}"
      - name: Desa els resultats a la branca
        if: always()
        run: |
          git config user.name "gruppetto-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add work
          git diff --cached --quiet && exit 0
          git commit -m "Revisió automàtica de plantilles"
          git push origin HEAD:${GITHUB_REF_NAME}
